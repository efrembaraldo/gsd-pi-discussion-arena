name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]        # deve combaciare col `name:` di ci.yml, verificato = "CI"
    types:
      - completed
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSD_PI_CHECKOUT: /tmp/gsd-pi
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm
        run: npm install -g npm@latest
      - name: Install pnpm
        run: npm install -g pnpm@10.12.1
      - name: Clone gsd-pi (shallow)
        run: git clone --depth 1 https://github.com/open-gsd/gsd-pi.git /tmp/gsd-pi
      - name: Install gsd-pi deps
        run: cd /tmp/gsd-pi && pnpm install --frozen-lockfile
      - name: Build gsd-pi packages (provides @gsd/pi-coding-agent dist)
        run: cd /tmp/gsd-pi && pnpm run build:pi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify version not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@efrembaraldo/gsd-pi-discussion-arena@$VERSION" version >/dev/null 2>&1; then
            echo "::error::Version @efrembaraldo/gsd-pi-discussion-arena@$VERSION is already published. Bump version in package.json first."
            exit 1
          fi
          echo "Version $VERSION is not yet published, proceeding."
      - name: Publish to npm
        run: npm publish --provenance --access public
