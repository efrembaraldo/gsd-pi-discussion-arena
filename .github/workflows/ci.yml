name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Consente il run manuale via `gh workflow run` (usato dalla verifica e2e)
  # e dal job e2e-auto-mode. Senza questo trigger, `gh workflow run` fallisce
  # con HTTP 422 "Workflow does not have 'workflow_dispatch' trigger".
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSD_PI_CHECKOUT: /tmp/gsd-pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pnpm
        run: npm install -g pnpm@10.12.1
      - name: Clone gsd-pi (shallow)
        run: git clone --depth 1 https://github.com/open-gsd/gsd-pi.git /tmp/gsd-pi
      - name: Install gsd-pi deps
        run: cd /tmp/gsd-pi && pnpm install --frozen-lockfile
      - name: Build gsd-pi packages (provides @gsd/pi-coding-agent dist)
        run: cd /tmp/gsd-pi && pnpm run build:pi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e-auto-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSD_PI_CHECKOUT: /tmp/gsd-pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Il job e2e NON lancia un subprocess gsd-pi reale (D022: costo dei test di
      # integrazione). L'estensione reale viene caricata in-process via activate()
      # e la dipendenza runtime @gsd/pi-coding-agent è coperta nello stub locale.
      # Il clone gsd-pi resta per parità col job di build (ambiente identico).
      - name: Clone gsd-pi (shallow)
        run: git clone --depth 1 https://github.com/open-gsd/gsd-pi.git /tmp/gsd-pi || true
      - run: npm ci
      - name: E2E — auto-mode adjust_tool_set simulation
        run: node --test tests/e2e-auto-mode.test.ts

  e2e-real:
    # D109: trigger CI per il job `e2e-real` in M011/S02/T03 = `workflow_dispatch`
    # (manuale on-demand via `gh workflow run e2e-real`). D022: nessuno spawn
    # `gsd` reale su push CI. Per questo il job NON aggiunge `pull_request:` o
    # `schedule:` e richiede `github.event_name == 'workflow_dispatch'`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Install reale del binario `gsd`: popola PATH per `scripts/e2e-real.mjs`
      # (vedi contract in scripts/e2e-real.mjs: skip implicito exit 2 se `gsd`
      # non è su PATH). `@latest` mantiene la matrice in sync con l'upstream.
      - run: npm install -g @opengsd/gsd-pi@latest
      - run: npm run e2e-real
